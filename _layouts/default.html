<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="sidebar">
    <h1><a href="{{ '/' | relative_url }}">{{ site.title }} 🐮</a></h1>
    <nav>
      <ul>
        <li><a href="{{ '/reading.html' | relative_url }}" {% if page.url == '/reading.html' %}class="active"{% endif %}>Reading</a></li>
        <li><a href="{{ '/musings.html' | relative_url }}" {% if page.url == '/musings.html' %}class="active"{% endif %}>Musings</a></li>
        <li><a href="{{ '/projects.html' | relative_url }}" {% if page.url == '/projects.html' %}class="active"{% endif %}>Projects</a></li>
        <li><a href="{{ '/about.html' | relative_url }}" {% if page.url == '/about.html' %}class="active"{% endif %}>About</a></li>
      </ul>
    </nav>
  </div>

  <div class="content">
    {{ content }}
  </div>
</body>
</html>
